- name: remove headlamp ClusterRoleBinding
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: headlamp-admin

- name: remove headlamp ClusterRole
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    name: headlamp-admin

- name: remove headlamp namespace
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{cfg_values.namespace|default('headlamp')}}"

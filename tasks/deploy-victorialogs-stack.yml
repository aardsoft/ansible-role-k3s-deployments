# VictoriaLogs (log storage) + Vector (collector DaemonSet)
#
# VictoriaMetrics' log storage engine paired with Vector, a high-performance
# observability data pipeline from Datadog.
#
# Compared to loki this has some advantages:
#
# - significantly lower resource footprint
# - exposes a simple HTTP query API returning structured JSON - ideal for piping
#   log snippets directly into a LLM for processing
# - VRL (Vector Remap Language) is useful for log transformation/enrichment
#   before storage
# - simple builtin vmui via http
#
# It also hase some disadvantages:
#
# - smaller community than the Grafana stack; fewer pre-built dashboards
# - Grafana datasource plugin exists but is less mature than the Loki plugin
# - Vector's Kubernetes enrichment (pod labels, annotations) requires the
#   kubernetes_logs source which needs RBAC; file-based collection used here
#   produces less metadata unless enriched via VRL path parsing
# - potentially less stable API due to it being quite new
#
# LLM query example (after deployment):
#   curl 'http://<victorialogs_ip>:9428/select/logsql/query' \
#     --data-urlencode 'query={job="k3s-pod-logs"} _time:1h' | jq .
#
# cfg_values keys:
#   namespace:              Kubernetes namespace              (default: logging)
#   storage_class:          PVC storage class                (default: longhorn)
#   storage_size:           VictoriaLogs PVC size            (default: 10Gi)
#   retention_period:       Log retention period             (default: 30d)
#   victorialogs_ip:        metallb LoadBalancer IP for direct API access (optional)
#                           API access (port 9428) bypasses Traefik auth for
#                           programmatic/log pipeline use without management-ui
#   ui_hostname:            DNS hostname for UI via Traefik   (optional, enables Ingress)
#                           Add hostname to k3s.hostnames in group_vars.
#   entrypoint:             Traefik entry point name          (default: management)
#   management_namespace:   Namespace where authelia runs             (default: management)
#   cluster_label:          Label added to all log streams    (default: k3s)
#   victorialogs_version:   victoriametrics chart version     (default: latest)
#   vector_version:         vector/vector chart version       (default: latest)
#
# Sample group_vars entry:
#   k3s:
#     deployments:
#       victorialogs-stack:
#         role: k3s-deployments
#         name: victorialogs-stack
#         state: present
#         config:
#           namespace: logging
#           storage_class: longhorn
#           storage_size: 10Gi
#           retention_period: 30d
#           victorialogs_ip: 192.168.33.130
#           cluster_label: storage1

- name: add VictoriaMetrics Helm repo
  kubernetes.core.helm_repository:
    name: victoriametrics
    repo_url: https://victoriametrics.github.io/helm-charts/

# TODO, we want to support air gapped here
- name: add Vector Helm repo
  kubernetes.core.helm_repository:
    name: vector
    repo_url: https://helm.vector.dev

- name: deploy VictoriaLogs
  kubernetes.core.helm:
    kubeconfig: "{{_k3s_kubecfg}}"
    namespace: "{{cfg_values.namespace|default('logging')}}"
    create_namespace: true
    name: victorialogs
    chart_ref: victoria-logs-single
    chart_repo_url: https://victoriametrics.github.io/helm-charts/
    chart_version: "{{cfg_values.victorialogs_version|default(omit)}}"
    values: "{{lookup('template', 'victorialogs-stack-victorialogs-values.j2') | from_yaml}}"

- name: deploy Vector
  kubernetes.core.helm:
    kubeconfig: "{{_k3s_kubecfg}}"
    namespace: "{{cfg_values.namespace|default('logging')}}"
    create_namespace: true
    name: vector
    chart_ref: vector
    chart_repo_url: https://helm.vector.dev
    chart_version: "{{cfg_values.vector_version|default(omit)}}"
    values: "{{lookup('template', 'victorialogs-stack-vector-values.j2') | from_yaml}}"

- name: check VictoriaLogs middleware for stale basicAuth spec
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{cfg_values.namespace|default('logging')}}"
  register: _vlogs_mw_check
  when: cfg_values.ui_hostname is defined

- name: remove VictoriaLogs middleware if basicAuth spec present
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{cfg_values.namespace|default('logging')}}"
  when: >
    cfg_values.ui_hostname is defined and
    (_vlogs_mw_check.resources | default([]) | length > 0) and
    (_vlogs_mw_check.resources[0].spec.basicAuth is defined)

- name: create ForwardAuth middleware for VictoriaLogs
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: management-auth
        namespace: "{{cfg_values.namespace|default('logging')}}"
        labels:
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      spec:
        forwardAuth:
          address: "http://authelia.{{cfg_values.management_namespace|default('management')}}.svc.cluster.local:9091/api/authz/forward-auth"
          authResponseHeaders:
            - X-Forwarded-User
          trustForwardHeader: true
  when: cfg_values.ui_hostname is defined

- name: create VictoriaLogs UI ingress
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: victorialogs-ui
        namespace: "{{cfg_values.namespace|default('logging')}}"
        labels:
          configurator: ansible
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "{{cfg_values.entrypoint|default('management')}},{{cfg_values.entrypoint|default('management')}}-secure"
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "{{cfg_values.namespace|default('logging')}}-management-auth@kubernetescrd"
          forecastle.stakater.com/expose: "true"
          forecastle.stakater.com/appName: "VictoriaLogs"
          forecastle.stakater.com/group: "Observability"
          forecastle.stakater.com/url: "https://{{cfg_values.ui_hostname}}/select/vmui/"
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      spec:
        rules:
          - host: "{{cfg_values.ui_hostname}}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: victorialogs-victoria-logs-single-server
                      port:
                        number: 9428
  when: cfg_values.ui_hostname is defined

- name: create LoadBalancer service for external VictoriaLogs access
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: victorialogs-external
        namespace: "{{cfg_values.namespace|default('logging')}}"
        labels:
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      spec:
        type: LoadBalancer
        loadBalancerIP: "{{cfg_values.victorialogs_ip | ansible.utils.ipaddr('address')}}"
        selector:
          app.kubernetes.io/instance: victorialogs
          app.kubernetes.io/name: victoria-logs-single
        ports:
          - name: http
            port: 9428
            targetPort: 9428
            protocol: TCP
  when: cfg_values.victorialogs_ip is defined

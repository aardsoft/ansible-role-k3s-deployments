# Unified management UI for the k3s cluster.
#
# - Creates a ForwardAuth Traefik middleware (one per namespace that uses it)
#   pointing to an Authelia instance deployed separately via deploy-authelia.yml
# - Deploys Forecastle, which auto-discovers services from Ingress annotations
#
# This requires an authelia deployment (see deploy-authelia.yml) in the same or
# referenced namespace. The forward-auth middleware is created in kube-system and
# the management namespace; other service deployments create their own local copy
# pointing to the same authelia service.
#
# Traefik entry point IPs are configured under k3s.traefik.entrypoints for
# the cluster, and applied via the traefik-ansible-label.j2 server manifest
# template - that step needs to be in the main configuration for this UI setup
# to work.
#
# Forecastle discovers services automatically: any Ingress resource in any
# namespace that carries the forecastle.stakater.com/expose: "true" annotation
# will appear in the landing page.
#
# Required annotations for a service to appear in Forecastle:
#   forecastle.stakater.com/expose: "true"
#   forecastle.stakater.com/appName: "My Service"
# Optional:
#   forecastle.stakater.com/group: "Category"
#
# Auth is mandatory for all management-facing ingresses. Every ingress on
# the management entrypoint must carry this annotation:
#
#   traefik.ingress.kubernetes.io/router.middlewares: "{namespace}-management-auth@kubernetescrd"
#
# The middleware must be in the same namespace as the Ingress — Traefik does not
# resolve cross-namespace middleware references from Kubernetes Ingress annotations.
# This deployment creates the ForwardAuth middleware in kube-system and the
# management namespace. Other service deployments must create their own local
# copy (same name, pointing to the same forward-auth service).
# If the middleware does not exist (management-ui not deployed), Traefik will
# reject all requests to those routes — this is the intended fail-secure behaviour.
#
# SSO works via a session cookie scoped to .{cookie_domain}: login once at
# auth.{hostname} and all subdomains under {cookie_domain} are covered.
#
# cfg_values keys:
#   entrypoint:                Traefik entry point name from k3s.traefik.entrypoints (required)
#   hostname:                  DNS hostname for Forecastle landing page               (required)
#   namespace:                 Namespace for Forecastle + forward-auth    (default: management)
#   management_namespace:      Namespace where the authelia service     (default: management)
#                              lives. The forward-auth middleware points here.
#   forecastle_version:        Helm chart version                         (default: latest)
#   chart_repo:                Forecastle Helm repo URL                   (default: stakater upstream)
#   image_registry:            Registry prefix for air-gapped deployments (optional)
#   tls_cert_passdb:           Passdb path for TLS certificate PEM        (optional)
#   tls_key_passdb:            Passdb path for TLS private key PEM        (optional)
#                              When set, creates a management-tls Secret and a Traefik TLSStore
#                              named 'default', making this the cluster-wide default TLS cert.
#   tls_generate:              Auto-generate a signed server cert if passdb entries are empty
#     ca_cert_passdb:          Passdb path for signing CA cert            (required)
#     ca_key_passdb:           Passdb path for signing CA key             (required)
#     domains:                 List of SANs (DNS names)                   (required)
#     days:                    Validity in days                           (default: 365)
#
# Requires a separate authelia deployment in the same or referenced namespace.
# See deploy-authelia.yml for auth configuration (users, OIDC, etc.).
#
# Sample k3s cluster config:
#   k3s:
#     traefik:
#       entrypoints:
#         management:
#           ip: 172.31.255.20
#     deployments:
#       authelia:
#         state: present
#         config:
#           namespace: management
#           hostname: k3s.mgmt.example.com
#           entrypoint: management
#           auth_passdb: k3s/management-auth
#       management-ui:
#         state: present
#         config:
#           entrypoint: management
#           hostname: k3s.mgmt.example.com
#           namespace: management

- name: get current management namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
    name: "{{cfg_values.namespace|default('management')}}"
  register: _current_mgmt_ns

- name: create management namespace
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_desired}}"
  vars:
    _desired:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{cfg_values.namespace|default('management')}}"
        labels:
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
  when: _desired | k3s_content_changed(_current_mgmt_ns.resources[0] | default(none))

- name: check management middlewares for stale basicAuth spec
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{item}}"
  register: _mgmt_mw_check
  loop:
    - kube-system
    - "{{cfg_values.namespace|default('management')}}"

- name: remove management middlewares if basicAuth spec present
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{item.item}}"
  loop: "{{_mgmt_mw_check.results}}"
  when: >
    (item.resources | default([]) | length > 0) and
    (item.resources[0].spec.basicAuth is defined)

- name: get current ForwardAuth middlewares
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{item}}"
  loop:
    - kube-system
    - "{{cfg_values.namespace|default('management')}}"
  register: _current_mgmt_mws

- name: create ForwardAuth middleware
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_desired}}"
  vars:
    _desired:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: management-auth
        namespace: "{{item}}"
        labels:
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      spec:
        forwardAuth:
          address: "http://authelia.{{cfg_values.management_namespace|default(cfg_values.namespace|default('management'))}}.svc.cluster.local:9091/api/authz/forward-auth"
          authResponseHeaders:
            - Remote-User
            - Remote-Groups
            - Remote-Name
            - Remote-Email
          trustForwardHeader: true
    _current_mw: >-
      {{ (_current_mgmt_mws.results
          | selectattr('item', 'equalto', item)
          | map(attribute='resources')
          | first | default([])
          | first | default(none)) }}
  loop:
    - kube-system
    - "{{cfg_values.namespace|default('management')}}"
  when: _desired | k3s_content_changed(_current_mw)

- name: deploy Forecastle
  block:
    - name: deploy Forecastle
      kubernetes.core.helm:
        kubeconfig: "{{_k3s_kubecfg}}"
        namespace: "{{cfg_values.namespace|default('management')}}"
        create_namespace: true
        name: forecastle
        chart_ref: forecastle
        chart_repo_url: "{{cfg_values.chart_repo|default('https://stakater.github.io/stakater-charts')}}"
        chart_version: "{{cfg_values.forecastle_version|default(omit)}}"
        values: "{{lookup('template', 'forecastle-values.j2') | from_yaml}}"
  rescue:
    - name: abort on forecastle deploy failure
      ansible.builtin.fail:
        msg: >
          Forecastle Helm deploy failed with SSA conflict.
          The forecastle ConfigMap is owned by a different field manager
          (likely from an earlier force-patched deploy) and Helm cannot
          overwrite it.  To auto-heal this on the next run, set:
            k3s.deployments.management-ui.config.forecastle_auto_heal: true
          Alternatively, run manually:
            kubectl delete configmap forecastle -n management
            helm uninstall forecastle -n management
            # then re-run the playbook
      when: cfg_values.forecastle_auto_heal | default(false) | bool == false

    - name: remove conflicting forecastle ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: absent
        api_version: v1
        kind: ConfigMap
        name: forecastle
        namespace: "{{cfg_values.namespace|default('management')}}"

    - name: uninstall failed forecastle Helm release
      kubernetes.core.helm:
        kubeconfig: "{{_k3s_kubecfg}}"
        namespace: "{{cfg_values.namespace|default('management')}}"
        name: forecastle
        state: absent
      ignore_errors: true

    - name: deploy Forecastle (retry after cleanup)
      kubernetes.core.helm:
        kubeconfig: "{{_k3s_kubecfg}}"
        namespace: "{{cfg_values.namespace|default('management')}}"
        create_namespace: true
        name: forecastle
        chart_ref: forecastle
        chart_repo_url: "{{cfg_values.chart_repo|default('https://stakater.github.io/stakater-charts')}}"
        chart_version: "{{cfg_values.forecastle_version|default(omit)}}"
        values: "{{lookup('template', 'forecastle-values.j2') | from_yaml}}"

- name: get current Forecastle Ingress
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: forecastle
    namespace: "{{cfg_values.namespace|default('management')}}"
  register: _current_forecastle_ingress

- name: create Forecastle Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_desired}}"
  vars:
    _desired:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: forecastle
        namespace: "{{cfg_values.namespace|default('management')}}"
        labels:
          configurator: ansible
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "{{cfg_values.entrypoint}},{{cfg_values.entrypoint}}-secure"
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "{{cfg_values.namespace|default('management')}}-management-auth@kubernetescrd"
          forecastle.stakater.com/expose: "true"
          forecastle.stakater.com/appName: "Management Dashboard"
          forecastle.stakater.com/url: "https://{{cfg_values.hostname}}"
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      spec:
        rules:
          - host: "{{cfg_values.hostname}}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: forecastle
                      port:
                        number: 80
  when: _desired | k3s_content_changed(_current_forecastle_ingress.resources[0] | default(none))

# --- TLS certificate management ---
# Delegates to shared module.  Creates a TLS Secret from passdb entries and
# optionally auto-generates if empty.  Also creates a Traefik TLSStore when
# tlsstore is enabled.

- name: manage TLS certificates
  include_role:
    name: k3s
    tasks_from: manage_certificates.yml
  vars:
    _k3s_cert:
      name: "management-tls"
      namespace: "{{cfg_values.namespace|default('management')}}"
      cert_passdb: "{{cfg_values.tls_cert_passdb}}"
      key_passdb: "{{cfg_values.tls_key_passdb}}"
      generate: "{{cfg_values.tls_generate|default(omit)}}"
      tlsstore: true
      tlsstore_name: "default"
  when: cfg_values.tls_cert_passdb is defined


- name: remove Forecastle
  kubernetes.core.helm:
    kubeconfig: "{{_k3s_kubecfg}}"
    namespace: "{{cfg_values.namespace|default('management')}}"
    name: forecastle
    state: absent

# DEPRECATED: authelia cleanup below is kept for backward compatibility during
# the transition to deploy-authelia.yml.  In the future, destroying management-ui
# should NOT remove authelia — use destroy-authelia.yml instead.

- name: remove Authelia Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: authelia
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove Forecastle Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: forecastle
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove Authelia Deployment
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: authelia
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove Authelia Service
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: v1
    kind: Service
    name: authelia
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove Authelia Secret
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: v1
    kind: Secret
    name: authelia
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove Authelia ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: v1
    kind: ConfigMap
    name: authelia
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove ForwardAuth middleware from management namespace
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: "{{cfg_values.namespace|default('management')}}"

- name: remove ForwardAuth middleware from kube-system
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: traefik.io/v1alpha1
    kind: Middleware
    name: management-auth
    namespace: kube-system

- name: remove TLS certificates
  include_role:
    name: k3s
    tasks_from: destroy_certificates.yml
  vars:
    _k3s_cert:
      name: "management-tls"
      namespace: "{{cfg_values.namespace|default('management')}}"
      tlsstore: true
      tlsstore_name: "default"
  when: cfg_values.tls_cert_passdb is defined

- name: remove management namespace
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{cfg_values.namespace|default('management')}}"
